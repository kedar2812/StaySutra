# StaySutra — production stack on one Hostinger KVM 2 (Ubuntu 24.04, Mumbai).
#
# Three services: the Next standalone app, Postgres 16, and Caddy for automatic
# HTTPS and the security headers. Caddy handles certificate renewal on its own,
# so the client never has to think about certificates.
#
# DPR §3.1, §14.1

name: staysutra

services:
  app:
    build: &build
      context: .
      dockerfile: Dockerfile
      # Inlined by `next build`; runtime env alone is too late for these.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER}
        NEXT_PUBLIC_GA4_ID: ${NEXT_PUBLIC_GA4_ID}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      UPLOAD_DIR: /var/staysutra/uploads
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER}
      RESEND_API_KEY: ${RESEND_API_KEY}
      ENQUIRY_NOTIFY_EMAIL: ${ENQUIRY_NOTIFY_EMAIL}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      NEXT_PUBLIC_GA4_ID: ${NEXT_PUBLIC_GA4_ID}
      # iCal sync runs inside the app every CALENDAR_SYNC_MINUTES (default 15).
      # CRON_SECRET guards /api/cron/calendar-sync for a manual or external nudge.
      # The dashboard exists only on the client's server. The Vercel demo strips it.
      DASHBOARD_ENABLED: "true"
      CALENDAR_SYNC_MINUTES: ${CALENDAR_SYNC_MINUTES:-15}
      CRON_SECRET: ${CRON_SECRET}
    volumes:
      # Originals live on a host bind mount so they survive a rebuild and are
      # picked up by the nightly backup.
      - /var/staysutra/uploads:/var/staysutra/uploads
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # One-off: load /content into a fresh database and create the first owner.
  #   docker compose run --rm seed
  # Run it once only: the seed upserts, so a re-run overwrites dashboard edits
  # with the JSON in /content. deploy.sh borrows this image for migrations.
  # Built from the builder stage, which has the dev tools the runtime image
  # deliberately leaves out. Never starts on `up`.
  seed:
    profiles: ["tools"]
    build:
      <<: *build
      target: builder
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL}
      SEED_OWNER_NAME: ${SEED_OWNER_NAME}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD}
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Locale matters for text sorting; set it once, at initdb time.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /var/staysutra/backups:/backups
    networks:
      - internal
    # Deliberately not published to the host. Nothing outside this network
    # needs to reach Postgres, and UFW only allows 22/80/443 anyway.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      STAGING_DOMAIN: ${STAGING_DOMAIN}
      STAGING_USER: ${STAGING_USER}
      # bcrypt hash; single-quote it in .env or compose eats the $ signs.
      STAGING_PASSWORD_HASH: ${STAGING_PASSWORD_HASH}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
